name: Decode Hub Stats

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  send-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run script
        run: node script.js
